version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: codevolt-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - codevolt-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: codevolt-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/codevolt
      - JWT_SECRET=${JWT_SECRET:-change_this_secret}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
      - PISTON_API_URL=https://emkc.org/api/v2/piston
      - PORT=5000
    depends_on:
      - mongodb
    networks:
      - codevolt-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: codevolt-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - codevolt-network

volumes:
  mongo_data:

networks:
  codevolt-network:
    driver: bridge
